apiVersion: personaforge.sonic.net/v1alpha1
kind: Persona
metadata:
  name: l3-multirouting-lab
  description: Management-framework routing lab with OSPF, PIM, and PCEP daemons
  owner: dell-sonic-ocp-2026
compatibility:
  sonicRelease: "202605"
capabilities:
  require: [l3-forwarding, bgp, ssh-cli, platform-monitoring]
  omit: [link-aggregation, dhcp-relay, nat, macsec, mux, sflow, snmp, gnmi, telemetry, restapi]
overrides:
  features:
    lldp: disabled
  frrDaemons:
    bfdd: disabled
    ospfd: enabled
    pimd: enabled
    pathd: enabled
policy:
  failOnConfiguredDependency: true
  allowDisruptive: true
  allowNodeReboot: false
  persistRuntime: true
build:
  reduceFilesystem: false
