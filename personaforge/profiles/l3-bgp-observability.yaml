apiVersion: personaforge.sonic.net/v1alpha1
kind: Persona
metadata:
  name: l3-bgp-observability
  description: BGP leaf retaining common discovery and observability services
  owner: dell-sonic-ocp-2026
compatibility:
  sonicRelease: "202605"
capabilities:
  require: [l3-forwarding, bgp, ssh-cli, platform-monitoring, lldp, sflow, snmp, gnmi, telemetry]
  omit: [link-aggregation, dhcp-relay, nat, macsec, mux, restapi]
overrides:
  features:
    lldp: enabled
    sflow: enabled
    snmp: enabled
    gnmi: enabled
    telemetry: enabled
  frrDaemons:
    bfdd: disabled
policy:
  failOnConfiguredDependency: true
  allowDisruptive: true
  allowNodeReboot: false
  persistRuntime: true
build:
  reduceFilesystem: false
