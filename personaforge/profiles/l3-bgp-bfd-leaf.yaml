apiVersion: personaforge.sonic.net/v1alpha1
kind: Persona
metadata:
  name: l3-bgp-bfd-leaf
  description: BGP leaf with BFD enabled for fast failure detection
  owner: dell-sonic-ocp-2026
compatibility:
  sonicRelease: "202605"
capabilities:
  require: [l3-forwarding, bgp, bfd, ssh-cli, platform-monitoring]
  omit: [dhcp-relay, nat, macsec, mux, sflow, snmp, gnmi, telemetry, restapi]
overrides:
  features:
    lldp: enabled
  frrDaemons:
    bfdd: enabled
policy:
  failOnConfiguredDependency: true
  allowDisruptive: true
  allowNodeReboot: false
  persistRuntime: true
build:
  reduceFilesystem: true
